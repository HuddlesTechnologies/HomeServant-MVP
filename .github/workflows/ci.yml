# Runs on every pull request and push to main: the backend's type check and
# tests (against a throwaway Postgres), and the Flutter app's analyzer and
# tests. A red check here means something is broken before it's merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hs
          POSTGRES_PASSWORD: hs
          POSTGRES_DB: hs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hs:hs@localhost:5432/hs_test
      DIRECT_URL: postgresql://hs:hs@localhost:5432/hs_test
      TEST_DATABASE_URL: postgresql://hs:hs@localhost:5432/hs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
      - name: Migrations match the schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

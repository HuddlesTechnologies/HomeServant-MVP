# Render "Blueprint" — commit this and use "New > Blueprint" on Render to
# provision the API and its database together instead of clicking through
# the dashboard by hand. See backend/README.md for the full walkthrough.
databases:
  - name: homeservant-db
    plan: free
    region: oregon

services:
  - type: web
    name: homeservant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeservant-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: OTP_PROVIDER
        value: console
      - key: CORS_ORIGINS
        value: http://localhost:8765
      - key: PORT
        value: 3000

# Render "Blueprint" — commit this and use "New > Blueprint" on Render to
# provision the API service. Render's Blueprint feature only looks for
# this file at the repo root (this is a Flutter app with the NestJS API
# in backend/, hence `rootDir` below rather than the file living there).
# The database lives on Supabase instead of Render (see backend/README.md),
# so the `sync: false` env vars below are filled in by hand on the Render
# dashboard after the service is created, from values on the Supabase
# dashboard.
services:
  - type: web
    name: homeservant-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: homeservant-uploads
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: OTP_PROVIDER
        value: console
      - key: CORS_ORIGINS
        value: http://localhost:8765
      - key: PORT
        value: 3000
